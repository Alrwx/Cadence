name: Cadence
options:
  bundleIdPrefix: com.cadence
  deploymentTarget:
    iOS: "17.2"
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
settings:
  base:
    # Swift 5 mode: strict concurrency checks fight CVPixelBuffer/AsyncStream plumbing.
    SWIFT_VERSION: "5.0"
targets:
  Cadence:
    type: application
    platform: iOS
    sources:
      - path: Cadence
        excludes:
          - "**/.gitkeep"
          - Resources/Prompts
      # Folder reference: prompts load via Bundle.main.url(forResource:withExtension:subdirectory: "Prompts").
      - path: Cadence/Resources/Prompts
        type: folder
    dependencies:
      - package: MetaWearablesDAT
        products: [MWDATCore, MWDATCamera, MWDATMotion, MWDATSpeech]
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadence.app
        # "0" means no app ID: the SDK skips attestation while Developer Mode is on.
        META_APP_ID: "0"
        CLIENT_TOKEN: ""
    info:
      path: Cadence/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [cadence]
        MWDAT:
          AppLinkURLScheme: "cadence://"
          MetaAppID: $(META_APP_ID)
          ClientToken: $(CLIENT_TOKEN)
          TeamID: $(DEVELOPMENT_TEAM)
        UIBackgroundModes:
          - processing
          - bluetooth-central
          - bluetooth-peripheral
          - external-accessory
          - audio
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        NSBluetoothAlwaysUsageDescription: Connects to your Meta glasses.
        NSLocalNetworkUsageDescription: Connects to your glasses over Wi-Fi and to the Cadence server on your network.
        NSBonjourServices: [_bonjour._tcp]
        NSCameraUsageDescription: Records your voice sample video, and stands in for the glasses camera and head tracking when glasses aren't connected.
        NSMicrophoneUsageDescription: Records your voice sample and listens to the conversation so Cadence can suggest replies.
        NSSpeechRecognitionUsageDescription: Transcribes the conversation when glasses aren't connected.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
