services:
  server:
    build: ../apps/server
    env_file: ../.env
    ports: ["8000:8000"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # Remote inference fallback on the 3090: OpenAI-compatible API at :8080/v1.
  gemma:
    profiles: [gemma]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: ["-m", "/models/${GEMMA_MODEL}", "--host", "0.0.0.0", "--port", "8080", "-ngl", "99"]
    volumes: ["./models:/models:ro"]
    ports: ["8080:8080"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
